<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" width="100%" font-family="Inter, DejaVu Sans, sans-serif"><defs><marker id="a0" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#1F3864"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#BF8F00"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#2E75B6"/></marker><marker id="a3" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#C00000"/></marker></defs><rect x="12.0" y="10.0" width="150.0" height="150.0" rx="4" fill="#f1f4fa" stroke="#1F3864" stroke-width="1" stroke-dasharray="6,5"/><rect x="30.0" y="60.0" width="114.0" height="60.0" rx="5" fill="#1F3864" stroke="#0D1B33" stroke-width="1.2"/><text x="87.0" y="87.1" font-size="10.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">You</text><text x="87.0" y="100.2" font-size="9.0" fill="#FFFFFF" font-weight="normal" text-anchor="middle">phone, Telegram</text><rect x="190.0" y="10.0" width="300.0" height="330.0" rx="4" fill="#f1f7fc" stroke="#2E75B6" stroke-width="1" stroke-dasharray="6,5"/><rect x="210.0" y="48.0" width="120.0" height="52.0" rx="5" fill="#2E75B6" stroke="#1F4E79" stroke-width="1.2"/><text x="270.0" y="71.1" font-size="10.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">Control plane</text><text x="270.0" y="84.2" font-size="9.0" fill="#FFFFFF" font-weight="normal" text-anchor="middle">gateway, orchestrator</text><rect x="350.0" y="48.0" width="120.0" height="52.0" rx="5" fill="#ED7D31" stroke="#A2521A" stroke-width="1.2"/><text x="410.0" y="71.1" font-size="10.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">Agent runtime</text><text x="410.0" y="84.2" font-size="9.0" fill="#FFFFFF" font-weight="normal" text-anchor="middle">context window</text><rect x="210.0" y="130.0" width="120.0" height="52.0" rx="5" fill="#2E75B6" stroke="#1F4E79" stroke-width="1.2"/><text x="270.0" y="153.1" font-size="10.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">Policy gate</text><text x="270.0" y="166.2" font-size="9.0" fill="#FFFFFF" font-weight="normal" text-anchor="middle">allow-list, approval</text><rect x="350.0" y="130.0" width="120.0" height="52.0" rx="5" fill="#FFE699" stroke="#BF8F00" stroke-width="1.2"/><text x="410.0" y="153.1" font-size="10.5" fill="#3D2E00" font-weight="600" text-anchor="middle">State</text><text x="410.0" y="166.2" font-size="9.0" fill="#3D2E00" font-weight="normal" text-anchor="middle">sessions, notes, logs</text><rect x="210.0" y="214.0" width="260.0" height="46.0" rx="5" fill="#FFFFFF" stroke="#9aa5ae" stroke-width="1.2"/><text x="340.0" y="234.4" font-size="9.5" fill="#1d2731" font-weight="600" text-anchor="middle">Secrets</text><text x="340.0" y="246.3" font-size="8.0" fill="#1d2731" font-weight="normal" text-anchor="middle">API key, bot token, OAuth tokens (0640 / 0600)</text><text x="340.0" y="290.0" font-size="8.5" fill="#5b6670" font-weight="normal" text-anchor="middle" font-style="italic">Process sandbox: read-only code and config,</text><text x="340.0" y="302.0" font-size="8.5" fill="#5b6670" font-weight="normal" text-anchor="middle" font-style="italic">one writable state directory, no inbound ports</text><rect x="518.0" y="10.0" width="150.0" height="150.0" rx="4" fill="#f7f7f7" stroke="#7F7F7F" stroke-width="1" stroke-dasharray="6,5"/><rect x="536.0" y="60.0" width="114.0" height="60.0" rx="5" fill="#F2F2F2" stroke="#7F7F7F" stroke-width="1.2" stroke-dasharray="4,3"/><text x="593.0" y="87.1" font-size="10.5" fill="#3A3A3A" font-weight="600" text-anchor="middle">Claude API</text><text x="593.0" y="100.2" font-size="9.0" fill="#3A3A3A" font-weight="normal" text-anchor="middle">sees full context</text><rect x="518.0" y="186.0" width="150.0" height="154.0" rx="4" fill="#fdf3f3" stroke="#C00000" stroke-width="1" stroke-dasharray="6,5"/><rect x="536.0" y="230.0" width="114.0" height="64.0" rx="5" fill="#F2F2F2" stroke="#7F7F7F" stroke-width="1.2" stroke-dasharray="4,3"/><text x="593.0" y="252.6" font-size="10.5" fill="#3A3A3A" font-weight="600" text-anchor="middle">Intervals.icu</text><text x="593.0" y="265.7" font-size="9.0" fill="#3A3A3A" font-weight="normal" text-anchor="middle">your data +</text><text x="593.0" y="278.8" font-size="9.0" fill="#3A3A3A" font-weight="normal" text-anchor="middle">untrusted text</text><path d="M144.0,80.0 L210.0,80.0" fill="none" stroke="#FFFFFF" stroke-width="5.6" stroke-linejoin="round"/><path d="M144.0,80.0 L210.0,80.0" fill="none" stroke="#1F3864" stroke-width="1.6" marker-end="url(#a0)" stroke-linejoin="round"/><path d="M210.0,96.0 L144.0,106.0" fill="none" stroke="#FFFFFF" stroke-width="5.6" stroke-linejoin="round"/><path d="M210.0,96.0 L144.0,106.0" fill="none" stroke="#1F3864" stroke-width="1.6" marker-end="url(#a0)" stroke-linejoin="round"/><path d="M470.0,66.0 L536.0,80.0" fill="none" stroke="#FFFFFF" stroke-width="5.6" stroke-linejoin="round"/><path d="M470.0,66.0 L536.0,80.0" fill="none" stroke="#BF8F00" stroke-width="1.6" marker-end="url(#a1)" stroke-linejoin="round"/><path d="M536.0,100.0 L470.0,92.0" fill="none" stroke="#FFFFFF" stroke-width="5.6" stroke-linejoin="round"/><path d="M536.0,100.0 L470.0,92.0" fill="none" stroke="#BF8F00" stroke-width="1.6" marker-end="url(#a1)" stroke-linejoin="round"/><path d="M300.0,182.0 L300.0,198.0 L504.0,198.0 L504.0,246.0 L536.0,246.0" fill="none" stroke="#FFFFFF" stroke-width="5.6" stroke-linejoin="round"/><path d="M300.0,182.0 L300.0,198.0 L504.0,198.0 L504.0,246.0 L536.0,246.0" fill="none" stroke="#2E75B6" stroke-width="1.6" marker-end="url(#a2)" stroke-linejoin="round"/><path d="M536.0,280.0 L482.0,280.0 L482.0,116.0 L440.0,116.0 L440.0,100.0" fill="none" stroke="#FFFFFF" stroke-width="5.6" stroke-linejoin="round"/><path d="M536.0,280.0 L482.0,280.0 L482.0,116.0 L440.0,116.0 L440.0,100.0" fill="none" stroke="#C00000" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#a3)" stroke-linejoin="round"/><rect x="12" y="362" width="656" height="100" rx="4" fill="#fffaf0" stroke="#BF8F00"/><text x="24.0" y="380.0" font-size="10.5" fill="#1F3864" font-weight="700" text-anchor="start">Lethal-trifecta check for this agent (Willison)</text><text x="24.0" y="402.0" font-size="9.5" fill="#1d2731" font-weight="600" text-anchor="start">Private data</text><text x="170.0" y="402.0" font-size="9.5" fill="#1d2731" font-weight="normal" text-anchor="start">yes: training, sleep and health-adjacent data (P)</text><text x="24.0" y="420.0" font-size="9.5" fill="#1d2731" font-weight="600" text-anchor="start">Untrusted content</text><text x="170.0" y="420.0" font-size="9.5" fill="#1d2731" font-weight="normal" text-anchor="start">yes: activity names, notes, shared workout and event text (U)</text><text x="24.0" y="438.0" font-size="9.5" fill="#1d2731" font-weight="600" text-anchor="start">External communication</text><text x="170.0" y="438.0" font-size="9.5" fill="#1d2731" font-weight="normal" text-anchor="start">constrained: replies go only to the owner&#x27;s allow-listed chat; no web, email or links tool</text><text x="24.0" y="456.0" font-size="8.5" fill="#5b6670" font-weight="normal" text-anchor="start" font-style="italic">P = private data · U = untrusted content · adding any tool that can send data elsewhere completes the trifecta</text><rect x="17.0" y="15.0" width="76.0" height="18.0" fill="#f1f4fa"/><text x="22.0" y="26.0" font-size="11.0" fill="#1F3864" font-weight="700" text-anchor="start">Owner zone</text><rect x="195.0" y="15.0" width="135.4" height="18.0" fill="#f1f7fc"/><text x="200.0" y="26.0" font-size="11.0" fill="#1F3864" font-weight="700" text-anchor="start">Host zone (your VM)</text><rect x="523.0" y="15.0" width="102.4" height="18.0" fill="#f7f7f7"/><text x="528.0" y="26.0" font-size="11.0" fill="#1F3864" font-weight="700" text-anchor="start">Model provider</text><rect x="523.0" y="191.0" width="115.6" height="18.0" fill="#fdf3f3"/><text x="528.0" y="202.0" font-size="11.0" fill="#1F3864" font-weight="700" text-anchor="start">Third-party data</text><rect x="170.5" y="64.3" width="12.9" height="14.0" rx="2" fill="#FFFFFF"/><text x="177.0" y="75.2" font-size="9.0" fill="#1F3864" font-weight="600" text-anchor="middle">P</text><rect x="170.5" y="104.3" width="12.9" height="14.0" rx="2" fill="#FFFFFF"/><text x="177.0" y="115.2" font-size="9.0" fill="#1F3864" font-weight="600" text-anchor="middle">P</text><rect x="491.6" y="54.4" width="22.9" height="14.0" rx="2" fill="#FFFFFF"/><text x="503.0" y="65.2" font-size="9.0" fill="#BF8F00" font-weight="600" text-anchor="middle">P+U</text><rect x="485.8" y="99.2" width="34.4" height="12.4" rx="2" fill="#FFFFFF"/><text x="503.0" y="108.8" font-size="8.0" fill="#BF8F00" font-weight="600" text-anchor="middle">output</text><rect x="374.0" y="191.2" width="52.0" height="12.4" rx="2" fill="#FFFFFF"/><text x="400.0" y="200.8" font-size="8.0" fill="#2E75B6" font-weight="600" text-anchor="middle">tool calls</text><rect x="442.8" y="293.2" width="78.4" height="12.4" rx="2" fill="#FFFFFF"/><text x="482.0" y="302.8" font-size="8.0" fill="#C00000" font-weight="600" text-anchor="middle">U (tool results)</text></svg>