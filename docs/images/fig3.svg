rs?</text><text x="562.0" y="144.2" font-size="9.0" fill="#3D2E00" font-weight="normal" text-anchor="middle">operational store</text><rect x="476.0" y="188.0" width="172.0" height="44.0" rx="5" fill="#2E75B6" stroke="#1F4E79" stroke-width="1.2"/><text x="562.0" y="207.1" font-size="10.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">Send via Delivery</text><text x="562.0" y="220.2" font-size="9.0" fill="#FFFFFF" font-weight="normal" text-anchor="middle">then mark sent</text><path d="M562.0,80.0 L562.0,112.0" fill="none" stroke="#FFFFFF" stroke-width="5.6" stroke-linejoin="round"/><path d="M562.0,80.0 L562.0,112.0" fill="none" stroke="#2E75B6" stroke-width="1.6" marker-end="url(#a0)" stroke-linejoin="round"/><path d="M562.0,156.0 L562.0,188.0" fill="none" stroke="#FFFFFF" stroke-width="5.6" stroke-linejoin="round"/><path d="M562.0,156.0 L562.0,188.0" fill="none" stroke="#2E75B6" stroke-width="1.6" marker-end="url(#a0)" stroke-linejoin="round"/><text x="562.0" y="262.0" font-size="9.0" fill="#5b6670" font-weight="normal" text-anchor="middle" font-style="italic">Reminders were created earlier by</text><text x="562.0" y="275.0" font-size="9.0" fill="#5b6670" font-weight="normal" text-anchor="middle" font-style="italic">the model (add_reminder, with a</text><text x="562.0" y="288.0" font-size="9.0" fill="#5b6670" font-weight="normal" text-anchor="middle" font-style="italic">dedupe key) but are sent by plain</text><text x="562.0" y="301.0" font-size="9.0" fill="#5b6670" font-weight="normal" text-anchor="middle" font-style="italic">code: no tokens, no API dependency.</text><rect x="17.0" y="15.0" width="227.8" height="18.0" fill="#FFFFFF"/><text x="22.0" y="26.0" font-size="11.0" fill="#1F3864" font-weight="700" text-anchor="start">Scheduled job (model in the loop)</text><rect x="461.0" y="15.0" width="194.8" height="18.0" fill="#FFFFFF"/><text x="466.0" y="26.0" font-size="11.0" fill="#1F3864" font-weight="700" text-anchor="start">Reminder dispatch (no model)</tex