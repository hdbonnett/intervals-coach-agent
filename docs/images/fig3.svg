<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="100%" font-family="Inter, DejaVu Sans, sans-serif"><defs><marker id="a0" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#2E75B6"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#ED7D31"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#7F7F7F"/></marker></defs><rect x="12.0" y="10.0" width="430.0" height="380.0" rx="4" fill="none" stroke="#8497B0" stroke-width="1" stroke-dasharray="6,5"/><rect x="456.0" y="10.0" width="212.0" height="380.0" rx="4" fill="none" stroke="#8497B0" stroke-width="1" stroke-dasharray="6,5"/><rect x="140.0" y="40.0" width="175.0" height="40.0" rx="5" fill="#2E75B6" stroke="#1F4E79" stroke-width="1.2"/><text x="227.5" y="57.1" font-size="10.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">Cron fires</text><text x="227.5" y="70.2" font-size="9.0" fill="#FFFFFF" font-weight="normal" text-anchor="middle">06:40 morning_briefing</text><rect x="140.0" y="104.0" width="175.0" height="44.0" rx="5" fill="#2E75B6" stroke="#1F4E79" stroke-width="1.2"/><text x="227.5" y="123.1" font-size="10.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">Render job prompt</text><text x="227.5" y="136.2" font-size="9.0" fill="#FFFFFF" font-weight="normal" text-anchor="middle">date, attempt note</text><rect x="140.0" y="172.0" width="175.0" height="44.0" rx="5" fill="#ED7D31" stroke="#A2521A" stroke-width="1.2"/><text x="227.5" y="191.1" font-size="10.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">Agent run</text><text x="227.5" y="204.2" font-size="9.0" fill="#FFFFFF" font-weight="normal" text-anchor="middle">fresh session, read tools</text><path d="M227,242 L299,268 L227,294 L155,268 z" fill="#FFFFFF" stroke="#2E75B6" stroke-width="1.3"/><text x="227.0" y="266.0" font-size="9.5" fill="#1F3864" font-weight="600" text-anchor="middle">Control signal</text><text x="227.0" y="278.0" font-size="9.0" fill="#1F3864" font-weight="normal" text-anchor="middle">in reply?</text><rect x="22.0" y="322.0" width="120.0" height="52.0" rx="5" fill="#FFFFFF" stroke="#9aa5ae" stroke-width="1.2"/><text x="82.0" y="339.4" font-size="9.5" fill="#1d2731" font-weight="600" text-anchor="middle">DATA_NOT_READY</text><text x="82.0" y="351.3" font-size="8.0" fill="#1d2731" font-weight="normal" text-anchor="middle">retry in 45 min</text><text x="82.0" y="363.2" font-size="8.0" fill="#1d2731" font-weight="normal" text-anchor="middle">(max 2)</text><rect x="160.0" y="322.0" width="130.0" height="52.0" rx="5" fill="#FFFFFF" stroke="#9aa5ae" stroke-width="1.2"/><text x="225.0" y="345.4" font-size="9.5" fill="#1d2731" font-weight="600" text-anchor="middle">NOTHING_TO_REPORT</text><text x="225.0" y="357.3" font-size="8.0" fill="#1d2731" font-weight="normal" text-anchor="middle">stay silent</text><rect x="308.0" y="322.0" width="122.0" height="52.0" rx="5" fill="#2E75B6" stroke="#1F4E79" stroke-width="1.2"/><text x="369.0" y="339.4" font-size="9.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">Normal reply</text><text x="369.0" y="351.3" font-size="8.0" fill="#FFFFFF" font-weight="normal" text-anchor="middle">make it the chat&#x27;s</text><text x="369.0" y="363.2" font-size="8.0" fill="#FFFFFF" font-weight="normal" text-anchor="middle">session; deliver</text><path d="M227.0,80.0 L227.0,104.0" fill="none" stroke="#FFFFFF" stroke-width="5.6" stroke-linejoin="round"/><path d="M227.0,80.0 L227.0,104.0" fill="none" stroke="#2E75B6" stroke-width="1.6" marker-end="url(#a0)" stroke-linejoin="round"/><path d="M227.0,148.0 L227.0,172.0" fill="none" stroke="#FFFFFF" stroke-width="5.6" stroke-linejoin="round"/><path d="M227