[project]
name = "intervals-coach-agent"
version = "0.3.0"
description = "Telegram training coach agent built on the Claude Agent SDK and the Intervals.icu Connector (MCP)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "hdbonnett" }]
keywords = ["intervals.icu", "telegram", "claude", "agent", "mcp", "cycling", "training"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Topic :: Communications :: Chat",
]
requires-python = ">=3.11"
dependencies = [
  "claude-agent-sdk>=0.2",
  "python-telegram-bot>=21.0",
  "APScheduler>=3.10,<4",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
  "google-auth>=2.20",
  "requests>=2.31",
  "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/hdbonnett/intervals-coach-agent"
Issues = "https://github.com/hdbonnett/intervals-coach-agent/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
coach-agent = "coach.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["coach*"]

[tool.setuptools.package-data]
"coach.defaults" = ["prompts/*.md"]
